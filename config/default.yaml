# FreshRoute global parameters.
# Units: kg, km, hours, INR (₹), °C, days.
# Convention: every section has a `sources` map (param -> citation or "assumption: ...").
# Code never hardcodes these numbers; it reads them from here.

seeds:
  tuning: [1, 50]        # inclusive range used while developing / tuning
  validation: [51, 100]  # inclusive range used by `make eval` by default
  hidden_min: 1000       # seeds >= this are locked until the final M7 run
  sources:
    splits: "tuning / validation / hidden seed sets kept disjoint"

simulation:
  days: 14                    # simulated days per scenario run
  dispatch_hour: 6            # trucks leave the hub at 06:00 IST
  load_hours: 1.0             # loading + waiting at hub, at ambient temperature
  unload_hours: 1.0           # unloading at destination, at ambient temperature
  ambient_temp_c: 28.0        # Karnataka hub default (scenario-overridable)
  replan: false               # mid-day replanning hook (on for replan-vs-static runs)
  # Which validator findings make the simulator drop an allocation before execution:
  #   all  -> every violation
  #   hard -> only physical ones (capacity, stock, vehicle, lane, window, reefer group);
  #           shelf-life / min-quality findings are counted but the load still ships.
  drop_violations: all
  settle_extra_days: 3        # keep settling in-transit deliveries this many days after the run
  sources:
    ambient_temp_c: "assumption: Karnataka hub ambient default 28 °C"
    load_hours: "assumption: 1.0 h"
    unload_hours: "assumption: 1.0 h"
    dispatch_hour: "assumption: early-morning dispatch typical for mandi supply"

generator:
  # Daily volume arriving at the hub per commodity (kg) before seasonality/regime/scenario.
  base_daily_supply_kg:
    spinach: 1950
    tomato: 5850
    okra: 2600
    mango: 3900
    cabbage: 3900
    onion: 5200
  supply_noise_sd: 0.15          # log-sd of day-to-day volume
  qty_median_kg: 600             # batch size lognormal median
  qty_sigma: 0.6                 # batch size lognormal sigma
  qty_min_kg: 200
  qty_max_kg: 2000
  grade_probs: {A: 0.6, B: 0.3, C: 0.1}
  grade_life_mult: {A: 1.0, B: 0.9, C: 0.75}   # share of reference life a grade starts with
  grade_sd_frac: {A: 0.10, B: 0.15, C: 0.20}   # remaining-life sd as a fraction of the mean
  cost_basis_frac: [0.60, 0.75]                # of forecast base price
  ambient_noise_sd_c: 1.5                      # day-to-day sd of true ambient around the forecast
  # Demand the hub can sell across all destinations, as a multiple of its supply (sets B_D for
  # both fitted and placeholder market data; Agmarknet gives the shape, not this level).
  demand_to_supply: 3.0
  placeholder_sigma_log_demand: 0.10           # day-to-day log-sd of true demand per (dest, commodity)
  placeholder_sigma_log_price: 0.10
  sources:
    base_daily_supply_kg: "assumption: Kolar aggregator averaging ~23 t/day; with fitted seasonality the July mango+tomato peak (~31 t/day) fits the 48 t/day fleet"
    qty: "assumption: batch qty lognormal, 200–2,000 kg"
    grade_sd_frac: "assumption: sd 10–20% of mean, grade-dependent"
    cost_basis_frac: "assumption: cost basis 60–75% of forecast base price"
    grade_probs: "assumption"
    ambient_noise_sd_c: "assumption"
    placeholder_sigma_log: "assumption: placeholder noise until fitted from Agmarknet residuals (M2)"
    demand_to_supply: "assumption: one aggregator is a small share of mandi arrivals, so the markets absorb ~3× its supply"
    grade_life_mult: "assumption"

shelf_life:
  q10_default: 2.0
  chill_penalty: 1.5          # multiplier on ΔL when below chill threshold
  # Quality -> price multiplier m(q), disclosed rule.
  price_bands:
    full_q: 0.6               # q >= full_q -> 1.0
    mid_q: 0.3                # mid_q <= q < full_q -> linear mid_low_mult .. 1.0
    mid_low_mult: 0.70
    clearance_q: 0.15         # clearance_q <= q < mid_q -> clearance_mult
    clearance_mult: 0.50
    # q < clearance_q -> 0 (spoiled: write-off + disposal)
  sources:
    q10_default: "arXiv 2511.05920 uses Q10=2; literature range 1.5–3"
    chill_penalty: "assumption: 1.5"
    price_bands: "assumption: disclosed quality-price rule"

travel:
  speed_kmph: 40.0
  road_factor: 1.3            # haversine -> road distance when OSRM matrix is absent
  delay_prob: 0.2             # share of legs that incur a delay
  delay_mean_h_per_100km: 0.5 # TruncNormal mean, scaled by distance/100 km
  delay_sd_h_per_100km: 0.2
  sources:
    speed_kmph: "assumption: 40 km/h for Indian highway trucks"
    road_factor: "assumption: haversine × 1.3"
    delay_prob: "arXiv 2511.05920 delay model (20% probability)"
    delay_mean_h_per_100km: "arXiv 2511.05920 pattern"

cost:
  disposal_per_kg: 1.0               # ₹/kg for spoiled / unsold produce
  writeoff_per_kg: 0.0               # extra ₹/kg on unsold stock in discount EV (procurement is sunk)
  unmet_demand_penalty_per_kg: 2.0   # π, objective only; never booked as cash
  discount_ladder_pct: [0, 10, 20, 35]
  discount_elasticity: 1.5           # 10% off -> +15% sell-through
  discount_uplift_cap: 0.40          # sell-through uplift capped at +40%
  hub_storage_temp_c: 24.0           # ventilated packhouse at the hub (held stock ages here)
  sources:
    disposal_per_kg: "assumption: municipal/compost disposal incl. handling"
    writeoff_per_kg: "decision: 0 so discount EV matches the net-revenue metric (no procurement cost)"
    unmet_demand_penalty_per_kg: "assumption: goodwill penalty, objective only"
    discount_ladder_pct: "assumption: discount ladder"
    discount_elasticity: "assumption: 10% off -> +15% sell-through, capped at +40%"
    hub_storage_temp_c: "assumption: shaded, ventilated packhouse ~4 °C below ambient"

market:
  demand_price_elasticity: -0.4      # ε_d used in the Festival Demand Index
  forecast_mode: full                # full | no_calendar | flat
  horizon_days: 3                    # H: forecast + hold-value look-ahead
  fdi_window: [-7, 2]                # festival offsets τ studied (days)
  fdi_bootstrap_resamples: 1000
  fdi_min_years: 3                   # a festival effect needs ≥ 3 years observed to be kept
  sources:
    demand_price_elasticity: "assumption: −0.4 (range −0.3…−0.6)"
    horizon_days: "assumption: H = 3 days look-ahead"

planner:
  risk_p: 0.9                        # chance-constraint probability ("risk appetite")
  solver: SCIP                       # OR-Tools pywraplp backend
  time_limit_s: 10.0
  split_batches: true                # false -> x[b,d,v] binary
  fairness_enabled: false
  fairness_phi: 0.6
  festival_guard_fdi: 0.10           # discount-engine festival guard threshold
  festival_guard_days: 2
  sources:
    risk_p: "assumption: p = 0.9"
    time_limit_s: "assumption: 10 s"
    fairness_phi: "assumption: φ = 0.6"
    festival_guard_fdi: "assumption: 10% demand uplift counts as a festival signal"

evaluation:
  bootstrap_resamples: 2000          # resamples over seeds for means and paired differences
  ci_level: 0.95
  baseline: fifo_nearest             # headline comparison is vs B1
  sources:
    bootstrap_resamples: "assumption: percentile bootstrap, 2,000 resamples"
    baseline: "B1 is the documented baseline"

data:
  # Agmarknet daily arrivals + prices per market, republished as bulk CSV by India Data Portal
  # (ODC-By). The fetcher streams these and keeps only the rows below, so the multi-GB files
  # never land on disk. Output: data/raw/agmarknet_south.csv (gitignored).
  agmarknet_sources:
    - name: old_source        # 2021-01-01 .. 2025-10-26
      url: "https://ckandev.indiadataportal.com/dataset/1749d812-35b4-4635-ac29-dd3116ed31b0/resource/21ecb9f0-7bf9-42d0-af24-df2e230e4a0a/download/apmc-arrivals-and-prices-old-source.csv"
      size_bytes: 4233268613
    - name: new_source        # 2025-10-27 .. 2026-05-31
      url: "https://ckandev.indiadataportal.com/dataset/1749d812-35b4-4635-ac29-dd3116ed31b0/resource/078fd1ea-dab6-4aca-aed9-3a4b8b2c761d/download/apmc-arrivals-and-prices-new-source.csv"
      size_bytes: 802731921
  agmarknet_states: [Karnataka, Tamil Nadu, Telangana, Andhra Pradesh, Kerala]
  # Case-insensitive substrings of commodity_name kept by the fetcher; exact names are chosen
  # per commodity at fit time.
  agmarknet_keywords: [tomato, onion, spinach, palak, bhindi, ladies, okra, cabbage, mango]
  # Road distances hub → destinations (public OSRM demo server, driving profile).
  osrm_url: "https://router.project-osrm.org"
  hub_district: Kolar
  region_of_state: {Karnataka: KA, Tamil Nadu: TN, Telangana: TS, Andhra Pradesh: AP, Kerala: KL}
  fit_train_years: [2021, 2024]      # fit seasonality / weekday / festival effects on these
  fit_holdout_year: 2025             # forecast WAPE (full vs no_calendar) is measured here
  fit_min_months: 36                 # a market series needs ≥ 36 of 48 train months for STL
  fit_price_years: 2                 # base price level = median of the last 2 train years
  fit_weekday_closed_share: 0.3      # weekday with < 30% of the busiest weekday's rows = reporting gap → factor 1
  sources:
    agmarknet_sources: "India Data Portal, Agriculture Marketing (APMC arrivals and prices), ODC-By — https://ckandev.indiadataportal.com/dataset/agriculture-marketing"
    fit_holdout_year: "last complete festival year in the data"
    osrm_url: "OSRM (BSD-2), OpenStreetMap data © OpenStreetMap contributors (ODbL)"

calendar:
  # Festival dates come from kalagana (computed for Bengaluru); config/festivals_override.csv
  # wins when it lists the same festival and year (e.g. a moon-sighting-dependent Eid date).
  location: bengaluru
  years: [2010, 2027]
  festivals:
    - {id: sankranti_pongal, tradition: kannada, match: Makar Sankranti, regions: [KA, TN, AP, TS], type: harvest}
    - {id: ugadi, tradition: kannada, match: Ugadi, regions: [KA, AP, TS], type: hindu}
    - {id: ramzan_start, tradition: kannada, match: Ramadan Begins, regions: [all], type: islamic}
    - {id: eid_al_fitr, tradition: kannada, match: Eid al-Fitr, regions: [all], type: islamic}
    - {id: varamahalakshmi, tradition: north, match: Raksha Bandhan, rule: friday_before, regions: [KA, TN, AP, TS], type: hindu}
    - {id: ganesh_chaturthi, tradition: north, match: Ganesh Chaturthi, regions: [all], type: hindu}
    - {id: onam, tradition: kannada, match: Onam, regions: [KL], type: harvest}
    - {id: navratri_start, tradition: north, match: Sharad Navratri, regions: [all], type: hindu}
    - {id: dasara, tradition: north, match: Dussehra, regions: [all], type: hindu}
    - {id: deepavali, tradition: north, match: Diwali, regions: [all], type: hindu}
    - {id: christmas, tradition: kannada, match: Christmas, regions: [all], type: christian}
  sources:
    festivals: "kalagana 0.1.3 (MIT) festival rules, Bengaluru; Islamic dates are tabular Hijri (±1–2 d)"
    varamahalakshmi: "observed on the Friday before Shravana Purnima (Raksha Bandhan)"
    regions: "assumption: regional observance (Pongal TN, Ugadi KA/AP/TS, Onam KL, others all)"

