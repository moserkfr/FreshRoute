sources:
  coordinates: "OpenStreetMap market locations (approximate)"
  receive_windows: "assumption: mandi early-morning trading; retail DC day shift; processor 24h"
  handling_cost_per_kg: "assumption: mandi commission + hamali ≈ ₹0.8–0.9/kg; DC dock ₹0.5; processor ₹0.3"
  min_quality_accepted: "spec §5: processor ~0.15, retail ~0.5, mandi ~0.3"
