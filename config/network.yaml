# Distribution network: one hub, 5–7 destinations.
# Receive windows are local hours [open, close). A truck arriving outside the window waits for
# the next opening. handling_cost_per_kg is the destination-side charge
# (commission / hamali / dock fee). min_quality_accepted is the buyer's freshness floor.
# demand_weight apportions placeholder base demand across destinations until Agmarknet is fitted.
# assumption: a Kolar aggregator sells mostly into Bengaluru (KR market, Hoskote DC) and the Malur
# processor; distant mandis take a smaller share of its produce.

hub:
  id: kolar_hub
  name: Kolar Aggregation Hub
  lat: 13.1360
  lon: 78.1290
  region: KA
  source: "Kolar APMC area"

destinations:
  - dest_id: blr_kr
    name: Bengaluru KR Market
    type: mandi
    lat: 12.9634
    lon: 77.5771
    region: KA
    receive_open_h: 3
    receive_close_h: 14
    handling_cost_per_kg: 0.8
    min_quality_accepted: 0.3
    demand_weight: 2.4
    agmarknet_markets: ["Bangalore", "Binny Mill (F&V), Bangalore"]

  - dest_id: blr_dc
    name: Bengaluru Retail DC (Hoskote)
    type: retail_dc
    lat: 13.0707
    lon: 77.7980
    region: KA
    receive_open_h: 6
    receive_close_h: 22
    handling_cost_per_kg: 0.5
    min_quality_accepted: 0.5
    demand_weight: 1.4
    agmarknet_markets: ["Bangalore", "Binny Mill (F&V), Bangalore"]
    price_premium: 1.08   # assumption: retail DC pays ~8% over mandi modal

  - dest_id: mysuru
    name: Mysuru APMC
    type: mandi
    lat: 12.2700
    lon: 76.6700
    region: KA
    receive_open_h: 3
    receive_close_h: 14
    handling_cost_per_kg: 0.8
    min_quality_accepted: 0.3
    demand_weight: 0.8
    agmarknet_markets: ["Mysore (Bandipalya)"]

  - dest_id: chennai_koyambedu
    name: Chennai Koyambedu
    type: mandi
    lat: 13.0700
    lon: 80.1950
    region: TN
    receive_open_h: 2
    receive_close_h: 14
    handling_cost_per_kg: 0.9
    min_quality_accepted: 0.3
    demand_weight: 0.9
    # proxy: Koyambedu is not reported in Agmarknet, and the Chennai-metro farmer markets that are
    # report retail prices (onion ~₹60/kg vs ~₹18 wholesale). Bengaluru wholesale + a premium
    # stands in for Koyambedu wholesale.
    agmarknet_markets: ["Bangalore", "Binny Mill (F&V), Bangalore"]
    price_premium: 1.10   # assumption: Koyambedu wholesale ≈ Bengaluru + 10% (larger, farther market)

  - dest_id: hyd_bowenpally
    name: Hyderabad Bowenpally
    type: mandi
    lat: 17.4710
    lon: 78.4760
    region: TS
    receive_open_h: 3
    receive_close_h: 14
    handling_cost_per_kg: 0.9
    min_quality_accepted: 0.3
    demand_weight: 0.4
    agmarknet_markets: ["Bowenpally", "Gudimalkapur"]

  - dest_id: hubballi
    name: Hubballi APMC
    type: mandi
    lat: 15.3700
    lon: 75.1100
    region: KA
    receive_open_h: 4
    receive_close_h: 14
    handling_cost_per_kg: 0.8
    min_quality_accepted: 0.3
    demand_weight: 0.3
    agmarknet_markets: ["Hubli (Amaragol)"]

  - dest_id: malur_proc
    name: Malur Food Processing Unit
    type: processor
    lat: 13.0040
    lon: 77.9380
    region: KA
    receive_open_h: 0
    receive_close_h: 24
    handling_cost_per_kg: 0.3
    min_quality_accepted: 0.15
    demand_weight: 0.8
    agmarknet_markets: ["Malur", "Kolar"]
    price_premium: 0.60   # assumption: processors pay ~60% of the local mandi modal

sources:
  coordinates: "OpenStreetMap market locations (approximate)"
  receive_windows: "assumption: mandi early-morning trading; retail DC day shift; processor 24h"
  handling_cost_per_kg: "assumption: mandi commission + hamali ≈ ₹0.8–0.9/kg; DC dock ₹0.5; processor ₹0.3"
  min_quality_accepted: "assumption: processor ~0.15, retail ~0.5, mandi ~0.3"
