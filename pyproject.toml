[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshroute"
version = "0.1.0"
description = "Shelf-life-aware, explainable distribution planning for perishable produce (PS03)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "pyyaml>=6",
    "pydantic>=2.5",
    "ortools>=9.8",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "kalagana>=0.1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["freshroute*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
